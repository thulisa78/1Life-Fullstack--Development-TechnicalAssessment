<div class="card">
  <h2>Saved sentences</h2>

  <p class="muted" *ngIf="loading">Loading…</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="muted" *ngIf="!loading && sentences.length === 0">
    No sentences saved yet — build one first.
  </p>

  <ul class="sentence-list" *ngIf="sentences.length">
    <li *ngFor="let sentence of sentences">
      <div class="sentence-item">
        <div>
          <strong>{{ sentence.title }}</strong>
          <p>{{ sentence.content }}</p>
          <span class="muted small">
            Updated {{ sentence.updated_at | date: 'medium' }}
          </span>
        </div>
        <button type="button" (click)="edit(sentence)">Edit</button>
      </div>
    </li>
  </ul>
</div>
